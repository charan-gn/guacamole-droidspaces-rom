name: 2 - Build Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone LOS 18.1 kernel
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_oneplus_sm8150 \
            kernel/

      - name: Fetch patches and config from charan-gn/guacamole-droidspaces-kernel
        run: |
          git clone --depth=1 \
            https://github.com/charan-gn/guacamole-droidspaces-kernel.git \
            kernel-src/
          cp kernel-src/kernel-patches.diff .
          cp kernel-src/kernel-config-backup .

      - name: Apply kernel patches
        run: |
          cd kernel
          git apply ../kernel-patches.diff 2>&1 || \
            git apply --reject ../kernel-patches.diff 2>&1 || true
          for rej in $(find . -name "*.rej" 2>/dev/null); do
            echo "=== REJECTED: $rej ==="
            cat "$rej"
          done

      - name: Apply manual source fixes
        run: |
          cd kernel

          # ── Remove opslalib ───────────────────────────────────────────
          sed -i 's/ opslalib\///' Makefile

          # ── Stub OnePlus undefined symbols ────────────────────────────
          printf "\nint game_start_state = 0;\nint game_rtt_wan_detect_flag = 0;\nint rtt_rear = 0;\nint sla_switch_enable = 0;\n" \
            >> net/opsla/op_sla.c

          # ── Fix all trace header include paths ────────────────────────
          find drivers -name "*trace.c" | sed 's|/[^/]*$||' | sort -u | while read dir; do
            if ! grep -q 'ccflags-y.*-I\$(src)' "$dir/Makefile" 2>/dev/null; then
              echo "ccflags-y += -I\$(src)" >> "$dir/Makefile"
            fi
          done

          # ── Fix IPA FORTIFY_SOURCE ────────────────────────────────────
          echo 'CFLAGS_ipa.o := -U__FORTIFY_SOURCE' >> drivers/platform/msm/ipa/ipa_v3/Makefile
          echo 'ccflags-y += -U__FORTIFY_SOURCE'    >> drivers/platform/msm/ipa/ipa_v3/Makefile

          # ── Fix IPA subdirectory trace headers ───────────────────────
          find drivers/platform/msm/ipa -name "Makefile" | while read f; do
            if ! grep -q 'ccflags-y.*-I\$(src)' "$f"; then
              echo "ccflags-y += -I\$(src)" >> "$f"
            fi
          done

          # ── Fix mdss pll trace header ─────────────────────────────────
          if ! grep -q 'ccflags-y.*-I\$(src)' drivers/clk/qcom/mdss/Makefile 2>/dev/null; then
            echo "ccflags-y += -I\$(src)" >> drivers/clk/qcom/mdss/Makefile
          fi

          # ── Fix camera core headers ───────────────────────────────────
          echo "ccflags-y += -I\$(src)"             >> drivers/media/platform/msm/camera/cam_core/Makefile
          echo "ccflags-y += -I\$(src)/../cam_utils" >> drivers/media/platform/msm/camera/cam_core/Makefile

          # ── Fix GPU msm trace headers ─────────────────────────────────
          echo "ccflags-y += -I\$(src)" >> drivers/gpu/msm/Makefile

          # ── Fix power supply Qualcomm warnings ───────────────────────
          echo "ccflags-y += -Wno-error -Wno-format -Wno-return-type -Wno-pointer-to-int-cast -Wno-implicit-int" \
            >> drivers/power/supply/qcom/Makefile

          # ── Fix hall sensor strict-prototypes ────────────────────────
          echo "ccflags-y += -Wno-strict-prototypes" >> drivers/tri_state_key/Makefile
          echo "ccflags-y += -Wno-strict-prototypes" >> drivers/tri_state_key/hall_ic/Makefile

          # ── Fix classmap.h missing socket include (patch rejection) ───
          sed -i '/#include <linux\/capability.h>/a #include <linux\/socket.h>' \
            security/selinux/include/classmap.h

          # ── Fix .bss.rtic relocation truncation ──────────────────────
          sed -i 's/#define __rticdata  __attribute__((section(".bss.rtic")))/#define __rticdata/' \
            include/linux/init.h

          # ── Fix proc_page_hot_count_operations undefined ──────────────
          sed -i '3288i const struct file_operations proc_page_hot_count_operations = { };' \
            fs/proc/base.c

          # ── Nullify __bad_copy_to/from ────────────────────────────────
          sed -i 's/__bad_copy_from();/(void)0;/g' include/linux/thread_info.h
          sed -i 's/__bad_copy_to();/(void)0;/g'   include/linux/thread_info.h

          # ── Override -Werror globally ─────────────────────────────────
          echo 'KBUILD_CFLAGS += -Wno-error' >> Makefile

      - name: Apply kernel config
        run: |
          cd kernel
          cp ../kernel-config-backup .config

          # ── Add DroidSpaces config flags ──────────────────────────────
          scripts/config \
            --enable  POSIX_MQUEUE \
            --enable  CGROUP_PIDS \
            --enable  CGROUP_DEVICE \
            --enable  CGROUP_NET_PRIO \
            --enable  DEVTMPFS \
            --enable  DEVTMPFS_MOUNT \
            --enable  NF_TABLES \
            --enable  NETFILTER_ADVANCED \
            --enable  IP_NF_FILTER \
            --enable  NETFILTER_XT_TARGET_MASQUERADE \
            --enable  NETFILTER_XT_TARGET_TCPMSS \
            --enable  NETFILTER_XT_MATCH_ADDRTYPE \
            --enable  NF_CONNTRACK_NETLINK \
            --enable  NF_NAT_REDIRECT \
            --disable ANDROID_PARANOID_NETWORK

          # ── Disable CC_STACKPROTECTOR_STRONG ─────────────────────────
          sed -i '/CONFIG_CC_STACKPROTECTOR_STRONG/d' .config
          sed -i '/^CONFIG_CC_STACKPROTECTOR=y/d' .config
          sed -i '/^CONFIG_CC_STACKPROTECTOR_REGULAR=y/d' .config
          echo 'CONFIG_CC_STACKPROTECTOR_NONE=y' >> .config

      - name: Fetch NDK Clang r416183b (sparse checkout)
        run: |
          mkdir -p toolchain
          cd toolchain
          git init
          git remote add origin \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          echo "clang-r416183b/" >> .git/info/sparse-checkout
          git fetch --depth=1 origin master
          git checkout origin/master
          echo "CLANG_DIR=$(pwd)/clang-r416183b" >> $GITHUB_ENV

      - name: Fetch GCC 4.9 aarch64 toolchain
        run: |
          mkdir -p gcc-toolchain
          cd gcc-toolchain
          git init
          git remote add origin \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git fetch --depth=1 origin master
          git checkout origin/master
          echo "GCC_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Run olddefconfig
        run: |
          export PATH="$CLANG_DIR/bin:$GCC_DIR/bin:$PATH"
          cd kernel
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCC=gcc \
            olddefconfig

      - name: Build kernel
        run: |
          export PATH="$CLANG_DIR/bin:$GCC_DIR/bin:$PATH"
          cd kernel
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCC=gcc \
            KCFLAGS="-Wno-error=unknown-warning-option \
                     -Wno-format -Wno-return-type -Wno-implicit-int \
                     -Wno-unused-but-set-variable -Wno-unused-variable \
                     -U__FORTIFY_SOURCE" \
            -j$(nproc) 2>&1 | tee build.log
          echo "--- LAST 50 LINES ---"
          tail -50 build.log

      - name: Collect kernel artifact
        run: |
          ls -lh kernel/arch/arm64/boot/Image.gz-dtb
          cp kernel/arch/arm64/boot/Image.gz-dtb .

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: Image.gz-dtb
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel/build.log
          if-no-files-found: warn
          retention-days: 30
