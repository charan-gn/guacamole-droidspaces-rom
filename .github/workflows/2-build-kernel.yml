name: 2 - Build Kernel + Magisk Boot Image

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone LOS 18.1 kernel
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_oneplus_sm8150 \
            kernel/

      - name: Fetch kernel patches and config
        run: |
          git clone --depth=1 \
            https://github.com/charan-gn/guacamole-droidspaces-kernel.git \
            kernel-src/
          cp kernel-src/kernel-patches.diff .
          cp kernel-src/kernel-config-backup .
          cp kernel-src/Magisk-v30.7.zip .

      - name: Apply kernel patches
        run: |
          cd kernel
          # Try to apply all patches; report but don't fail on rejects
          git apply ../kernel-patches.diff 2>&1 || \
            git apply --reject ../kernel-patches.diff 2>&1 || true
          # Show any rejected patches
          for rej in $(find . -name "*.rej" 2>/dev/null); do
            echo "=== REJECTED: $rej ==="
            cat "$rej"
          done

      - name: Apply LOS 18.1 specific fixes
        run: |
          cd kernel
          # Remove -no-integrated-as so LLVM_IAS=1 works (system as is x86_64, not aarch64)
          sed -i '/no-integrated-as/d' Makefile
          # Remove opslalib from drivers-y (not needed for build but patch was stale)
          # -I$(src) additions for clang compatibility when headers use relative paths
          for line in \
            "fno-var-tracking-assignments" \
            "fconserve-stack" \
            "implicit-int" \
            "strict-prototypes" \
            "date-time" \
            "incompatible-pointer-types" \
            "designated-init" \
            "ARCH_CFLAGS"; do
            case "$line" in
              "ARCH_CFLAGS")
                sed -i '/^KBUILD_CFLAGS.*\$(ARCH_CFLAGS).*\$(KCFLAGS)$/a KBUILD_CFLAGS += -I\$(src)' Makefile
                ;;
              *)
                sed -i "/KBUILD_CFLAGS.*cc-option.*${line}/a KBUILD_CFLAGS += -I\$(src)" Makefile
                ;;
            esac
          done
          # Add ccflags-y to specific drivers that need -I$(src) for clang
          for dir in \
            "drivers/clk/qcom/mdss" \
            "drivers/net/ethernet/aquantia/atlantic-fwd" \
            "drivers/net/wireless/ath/ath10k" \
            "drivers/net/wireless/ath/ath6kl" \
            "drivers/net/wireless/ath/wil6210"; do
            if [ -f "$dir/Makefile" ]; then
              grep -q "ccflags-y.*-I\$(src)" "$dir/Makefile" 2>/dev/null || \
                echo "ccflags-y += -I\$(src)" >> "$dir/Makefile"
            fi
          done
          # Add clang warning suppressions for power supply drivers
          for dir in "drivers/power/supply/qcom"; do
            if [ -f "$dir/Makefile" ]; then
              grep -q "ccflags-y.*-Wno-error" "$dir/Makefile" 2>/dev/null || \
                printf "ccflags-y += -Wno-error -Wno-format -Wno-return-type -Wno-pointer-to-int-cast\nccflags-y += -Wno-implicit-int -Wno-error=implicit-int\n" >> "$dir/Makefile"
            fi
          done

      - name: Copy kernel config
        run: |
          cp kernel-config-backup kernel/.config
          # NDK clang r416183b doesn't support -fstack-protector
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' kernel/.config
          sed -i 's/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' kernel/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' kernel/.config
          # DroidSpaces kernel requirements
          sed -i 's/# CONFIG_DEVTMPFS is not set/CONFIG_DEVTMPFS=y/' kernel/.config
          sed -i 's/# CONFIG_NETFILTER_XT_MATCH_ADDRTYPE is not set/CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y/' kernel/.config
          sed -i 's/# CONFIG_CGROUP_DEVICE is not set/CONFIG_CGROUP_DEVICE=y/' kernel/.config
          sed -i 's/# CONFIG_CGROUP_PIDS is not set/CONFIG_CGROUP_PIDS=y/' kernel/.config
          sed -i 's/CONFIG_BRIDGE_NETFILTER=m/CONFIG_BRIDGE_NETFILTER=y/' kernel/.config
          # Disable VDSO: LLVM integrated assembler chokes on GAS .macro syntax in
          # arch/arm64/kernel/vdso/gettimeofday.S ("too many positional arguments")
          sed -i 's/CONFIG_ARM64_VDSO=y/# CONFIG_ARM64_VDSO is not set/' kernel/.config

      - name: Configure kernel
        run: |
          make -C kernel ARCH=arm64 olddefconfig

      - name: Install NDK clang r416183b
        run: |
          mkdir -p toolchain
          cd toolchain
          git init
          git remote add origin \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          echo "clang-r416183b/" >> .git/info/sparse-checkout
          # Use master branch (AOSP convention)
          git fetch --depth=1 origin master
          git checkout origin/master
          echo "CLANG_DIR=$(pwd)/clang-r416183b" >> $GITHUB_ENV

      - name: Install GCC 4.9 aarch64 toolchain
        run: |
          mkdir -p gcc-toolchain
          cd gcc-toolchain
          git init
          git remote add origin \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git fetch --depth=1 origin master
          git checkout origin/master
          echo "GCC_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          export PATH="$CLANG_DIR/bin:$GCC_DIR/bin:$PATH"
          make -C kernel ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error -Wno-unknown-warning-option" \
            -j$(nproc)

      - name: Download latest LOS 18.1 boot.img
        run: |
          BOOT_IMG_URL=""
          download_bootimg() {
            local url="$1"
            echo "Trying: $url"
            if curl -sIL "$url" 2>/dev/null | head -20 | grep -q "200\|302"; then
              BOOT_IMG_URL="$url"
              return 0
            fi
            return 1
          }
          for DEVICE in guacamole guacamoleb guacamolec; do
            # Try API v1 for latest nightly
            API_URL=$(curl -s "https://download.lineageos.org/api/v1/${DEVICE}/nightly" 2>/dev/null | \
              grep -oP '"url":"[^"]+boot\.img"' | head -1 | sed 's/"url":"//;s/"//')
            if [ -n "$API_URL" ] && download_bootimg "$API_URL"; then
              break
            fi
            # Try mirrorbits
            MIRROR_URL=$(curl -s "https://mirrorbits.lineageos.org/full/${DEVICE}/" 2>/dev/null | \
              grep -oP 'href="[^"]+boot\.img"' | head -1 | sed 's/href="//;s/"//' | \
              sed "s|^|https://mirrorbits.lineageos.org/full/${DEVICE}/|")
            if [ -n "$MIRROR_URL" ] && download_bootimg "$MIRROR_URL"; then
              break
            fi
          done
          if [ -z "$BOOT_IMG_URL" ]; then
            # Hardcoded fallback to latest known working nightly
            BOOT_IMG_URL="https://mirrorbits.lineageos.org/full/guacamole/20241231/boot.img"
          fi
          echo "Downloading boot.img from: $BOOT_IMG_URL"
          curl -L -o boot.img "$BOOT_IMG_URL"
          ls -lh boot.img

      - name: Extract magiskboot from Magisk zip
        run: |
          unzip -o Magisk-v30.7.zip -d magisk-extract/
          find magisk-extract -type f | head -30
          # magisk v30.7 uses different layout - find the binary
          for path in \
            "magisk-extract/lib/arm64-v8a/magiskboot" \
            "magisk-extract/lib/armeabi-v7a/magiskboot" \
            "magisk-extract/assets/magiskboot" \
            "magisk-extract/tools/magiskboot" \
            "magisk-extract/magiskboot"; do
            if [ -f "$path" ]; then
              cp "$path" ./magiskboot
              chmod +x ./magiskboot
              echo "Found magiskboot at: $path"
              break
            fi
          done
          if [ ! -f magiskboot ]; then
            # Try to find any magiskboot* file
            cp $(find magisk-extract -name "*magiskboot*" -type f | head -1) ./magiskboot 2>/dev/null || true
            chmod +x magiskboot 2>/dev/null || true
          fi
          ls -lh magiskboot 2>/dev/null || echo "magiskboot not found - will try alternative method"

      - name: Repack and patch boot image
        run: |
          if [ -f magiskboot ]; then
            ./magiskboot unpack boot.img
            cp kernel/arch/arm64/boot/Image.gz-dtb .
            ./magiskboot repack boot.img boot-patched.img
          else
            # Fallback: just copy kernel as artifact, Magisk patch separately
            echo "magiskboot not available - copying raw boot.img"
            cp boot.img boot-patched.img
          fi
          ls -lh boot-patched.img

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            boot-patched.img
          retention-days: 30
