name: 1 - Build PickleHik3 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone PickleHik3 upstream
        run: |
          git clone --depth=1 \
            https://github.com/PickleHik3/termux-launcher \
            picklehik3/

      - name: Clone termux-x11
        run: |
          git clone --depth=1 \
            https://github.com/termux/termux-x11 \
            picklehik3/termux-x11/

      - name: Apply AndroidManifest patch
        run: |
          git -C picklehik3 apply \
            $GITHUB_WORKSPACE/picklehik3-patches/AndroidManifest.patch

      - name: Apply termux-x11 patch
        run: |
          git -C picklehik3 apply \
            $GITHUB_WORKSPACE/picklehik3-patches/termux-x11.patch

      - name: Apply terminal-view dependencies patch
        run: |
          git -C picklehik3 apply \
            $GITHUB_WORKSPACE/picklehik3-patches/terminal-view-deps.patch

      - name: Copy DesktopActivity.java
        run: |
          mkdir -p picklehik3/app/src/main/java/com/termux/app/
          cp $GITHUB_WORKSPACE/picklehik3-patches/DesktopActivity.java \
             picklehik3/app/src/main/java/com/termux/app/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            2>&1 | tail -5

      - name: Build with Gradle
        run: |
          cd picklehik3
          chmod +x gradlew
          ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleRelease \
            -x lintVitalRelease -x lint \
            -PcompileSdkVersion=34 \
            -PtargetSdkVersion=34

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mykey.jks

      - name: Sign APK with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name apksigner -type f | head -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(which apksigner 2>/dev/null || echo "")
          fi
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER sign \
            --ks mykey.jks \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out PickleHik3-signed.apk \
            picklehik3/app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PickleHik3-signed
          path: PickleHik3-signed.apk
          retention-days: 30
